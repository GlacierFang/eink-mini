name: 编译固件

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签（留空则用 fw-<短SHA>）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 允许 git 读取工作区
        run: git config --global --add safe.directory '*'

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # 只缓存下载体积大的包，不缓存 ~/.platformio/penv。
      # penv 是 PlatformIO 自己的虚拟环境，shebang 写死创建时的 Python 路径，
      # Python 补丁号一变就 bad interpreter，命令直接 126 失败。
      - name: 缓存 PlatformIO 包
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-pkg-${{ hashFiles('firmware/platformio.ini') }}-py3.11.9

      # PlatformIO Core 必须钉在 6.1.18。
      # 6.2.0 会带 SCons 4.11+，SCons 4.11 起 ${func(args)} 要求被调函数
      # 接受 target/source/env/for_signature 关键字参数，而 espressif32 的
      # __get_board_flash_mode(env) 不匹配 -> 替换返回 SCons 的 _Null 哨兵 ->
      # elf2image 那步 print_cmd_line 里 _Null + str 抛 TypeError。
      # 6.1.18 + espressif32@6.9.0 实测编译通过。
      - name: 装 PlatformIO
        run: |
          set +e
          rm -rf ~/.platformio/penv
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'platformio==6.1.18'
          pio --version

      - name: 编译固件
        working-directory: firmware
        run: |
          set +e
          {
            echo '### pio 版本'
            pio --version
            echo
            echo '### platformio.ini'
            cat platformio.ini
            echo
            echo '### pio run -v'
          } > build.log
          pio run -v 2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          echo "PIORC=$rc" | tee -a build.log
          exit $rc

      - name: 提取编译错误
        if: always()
        working-directory: firmware
        run: |
          set +e
          echo "日志字节数: $(wc -c < build.log)"
          echo '### 错误行'
          grep -hn -iE 'error:|fatal error|undefined reference|no such file|bad interpreter|command not found|Traceback|TypeError' build.log \
            | grep -viE 'Node\.js 20 is deprecated|deprecat' \
            | head -20 | while IFS= read -r l; do
                esc=$(printf '%s' "$l" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-400)
                echo "::error::$esc"
              done
          echo '### 日志尾 20 行'
          tail -20 build.log | while IFS= read -r l; do
              esc=$(printf '%s' "$l" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-300)
              echo "::notice::$esc"
            done

      - name: 合并整片镜像
        if: success()
        working-directory: firmware
        run: |
          set -e
          python3 tools/merge_bin.py \
            .pio/build/esp32-c3-pro-mini \
            .pio/build/esp32-c3-pro-mini/eink-mini-merged.bin \
            partitions.csv

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eink-mini-firmware
          path: |
            firmware/.pio/build/esp32-c3-pro-mini/bootloader.bin
            firmware/.pio/build/esp32-c3-pro-mini/partitions.bin
            firmware/.pio/build/esp32-c3-pro-mini/boot_app0.bin
            firmware/.pio/build/esp32-c3-pro-mini/firmware.bin
            firmware/.pio/build/esp32-c3-pro-mini/eink-mini-merged.bin
            firmware/.pio/build/esp32-c3-pro-mini/flash_args.txt

      # 固件产物推到 fw-bin 分支 —— git 通道在受限网络下比 artifact 下载更稳。
      - name: 把固件产物推到分支
        if: success()
        env:
          SHA: ${{ github.sha }}
          BRANCH: fw-bin
        working-directory: firmware
        run: |
          set -e
          git config user.name 'ci'
          git config user.email 'ci@local'
          B=.pio/build/esp32-c3-pro-mini
          BASE=''
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            BASE=$(git rev-parse "refs/remotes/origin/$BRANCH")
          fi
          TMPIDX=$(mktemp)
          export GIT_INDEX_FILE=$TMPIDX
          if [ -n "$BASE" ]; then git read-tree "$BASE^{tree}"; else git read-tree --empty; fi
          for f in bootloader.bin partitions.bin boot_app0.bin firmware.bin eink-mini-merged.bin flash_args.txt; do
            BLOB=$(git hash-object -w "$B/$f")
            git update-index --add --cacheinfo 100644,$BLOB,"$f"
          done
          TREE=$(git write-tree)
          if [ -n "$BASE" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$BASE" -m "fw: $SHA")
          else
            COMMIT=$(git commit-tree "$TREE" -m "fw: $SHA")
          fi
          git push origin "$COMMIT:refs/heads/$BRANCH"
          echo "固件已推到 $BRANCH"

      # 建 GitHub Release，.bin 直接挂成附件。
      #
      # **放在 CI 里做**：附件上传需要能直连 GitHub 的环境，
      # 本地开发机常受网络策略限制；
      # 上传失败还可能连带撤销已创建的 Release 与 tag。
      # runner 跑在 GitHub 上，不受本地网络策略影响。
      - name: 建 GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.release_tag }}
        working-directory: firmware
        run: |
          set -e
          B=.pio/build/esp32-c3-pro-mini
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="fw-${SHA:0:8}"
          fi
          # 同名 release 已存在就跳过，不覆盖历史发布。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          cp tools/release_notes.md notes.md
          printf '\n对应提交：`%s`\n' "$SHA" >> notes.md
          (cd "$B" && sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin eink-mini-merged.bin flash_args.txt > SHA256SUMS)
          gh release create "$TAG" \
            --target "$SHA" \
            --title "eink-mini 固件 $TAG" \
            --notes-file notes.md \
            "$B/bootloader.bin" \
            "$B/partitions.bin" \
            "$B/boot_app0.bin" \
            "$B/firmware.bin" \
            "$B/eink-mini-merged.bin" \
            "$B/flash_args.txt" \
            "$B/SHA256SUMS"
          echo "Release $TAG 已发布"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: firmware/build.log

  # 主机渲染器（固件版式的主机端复刻）必须在 CI 里编过。
  #
  # 以前漏了 src/ink_font_state.cpp，链接报 undefined reference ——
  # 而 CI 不跑这个工具，工具坏了整整一个月没人知道，
  # 改计时器版式时连张预览图都出不来。
  host-render:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 编译主机渲染器
        working-directory: firmware
        run: |
          set -e
          sh tools/render_host.sh frame timer /tmp/timer-done.bin state=DONE remaining=0
          SZ=$(stat -c%s /tmp/timer-done.bin)
          echo "帧长: $SZ"
          test "$SZ" = "4736"

      - name: 渲染预览图
        working-directory: firmware
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          sh tools/render_host.sh /tmp/host-preview
          ls -l /tmp/host-preview

      - name: 上传预览图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-preview
          path: /tmp/host-preview
