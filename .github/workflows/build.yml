name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio
          pio --version

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build firmware
        working-directory: firmware
        run: |
          set -o pipefail
          echo "### pio version" > build.log
          pio --version >> build.log 2>&1
          echo "### platformio.ini" >> build.log
          cat platformio.ini >> build.log
          echo "### pio run" >> build.log
          pio run 2>&1 | tee -a build.log

      - name: Publish build log to summary
        if: always()
        working-directory: firmware
        run: |
          echo '### Build log' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Merge binary
        if: success()
        working-directory: firmware/.pio/build/esp32-c3-pro-mini
        run: |
          python - <<'PY'
          import pathlib
          parts = [
              (0x0,     pathlib.Path("bootloader.bin")),
              (0x8000,  pathlib.Path("partitions.bin")),
              (0xE000,  pathlib.Path("boot_app0.bin")),
              (0x10000, pathlib.Path("firmware.bin")),
          ]
          end = 0
          chunks = []
          for off, p in parts:
              data = p.read_bytes()
              chunks.append((off, data))
              end = max(end, off + len(data))
          buf = bytearray(b"\xff" * end)
          for off, data in chunks:
              buf[off:off + len(data)] = data
          out = pathlib.Path("eink-mini-merged.bin")
          out.write_bytes(bytes(buf))
          print(f"merged {out} -> {len(buf)} bytes (0x{end:X}), flash at 0x0")
          PY

      - name: Package artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eink-mini-firmware
          path: |
            firmware/.pio/build/esp32-c3-pro-mini/bootloader.bin
            firmware/.pio/build/esp32-c3-pro-mini/partitions.bin
            firmware/.pio/build/esp32-c3-pro-mini/boot_app0.bin
            firmware/.pio/build/esp32-c3-pro-mini/firmware.bin
            firmware/.pio/build/esp32-c3-pro-mini/eink-mini-merged.bin

      - name: Publish build log to ci-logs branch
        if: failure()
        working-directory: firmware
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41869137+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout -B ci-logs
          mkdir -p ci
          cp firmware/build.log ci/build.log || echo "no build.log captured" > ci/build.log
          git add ci/build.log
          git commit -m "ci: build log from ${{ github.sha }}" || true
          git push origin ci-logs

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: firmware/build.log
