name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio
          pio --version

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build firmware
        working-directory: firmware
        run: |
          set -o pipefail
          {
            echo "### platformio version"
            pio --version
            echo
            echo "### platformio.ini"
            cat platformio.ini
            echo
            echo "### pio run"
          } > build.log
          pio run -v 2>&1 | tee -a build.log

      - name: Publish build log to summary
        if: always()
        working-directory: firmware
        run: |
          echo "### Build log" >> $GITHUB_STEP_SUMMARY
          echo "~~~" >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo "~~~" >> $GITHUB_STEP_SUMMARY

      - name: Merge binary
        if: success()
        working-directory: firmware/.pio/build/esp32-c3-pro-mini
        run: |
          python - <<'PY'
          import pathlib
          parts = [
              (0x0,     pathlib.Path("bootloader.bin")),
              (0x8000,  pathlib.Path("partitions.bin")),
              (0xE000,  pathlib.Path("boot_app0.bin")),
              (0x10000, pathlib.Path("firmware.bin")),
          ]
          end = 0
          chunks = []
          for off, p in parts:
              data = p.read_bytes()
              chunks.append((off, data))
              end = max(end, off + len(data))
          buf = bytearray(b"\xff" * end)
          for off, data in chunks:
              buf[off:off + len(data)] = data
          out = pathlib.Path("eink-mini-merged.bin")
          out.write_bytes(bytes(buf))
          print(f"merged {out} -> {len(buf)} bytes (0x{end:X}), flash at 0x0")
          PY

      - name: Package artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eink-mini-firmware
          path: |
            firmware/.pio/build/esp32-c3-pro-mini/bootloader.bin
            firmware/.pio/build/esp32-c3-pro-mini/partitions.bin
            firmware/.pio/build/esp32-c3-pro-mini/boot_app0.bin
            firmware/.pio/build/esp32-c3-pro-mini/firmware.bin
            firmware/.pio/build/esp32-c3-pro-mini/eink-mini-merged.bin

      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        working-directory: firmware
        run: |
          set +e
          echo "--- channel 1: repo file on ci-logs branch ---"
          if ! gh api "repos/$REPO/git/ref/heads/ci-logs" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq ".object.sha")
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/heads/ci-logs" -f sha="$MAIN_SHA" >/dev/null 2>&1
          fi
          B64=$(base64 -w0 build.log)
          gh api --method PUT "repos/$REPO/contents/ci/build-$SHA.log" \
            -f message="ci: build log $SHA" \
            -f content="$B64" \
            -f branch=ci-logs
          echo "--- channel 2: issue ---"
          {
            echo "Build failed at commit $SHA"
            echo
            echo "<details><summary>build.log</summary>"
            echo
            echo "~~~"
            cat build.log
            echo "~~~"
            echo "</details>"
          } > /tmp/body.md
          gh issue create --repo "$REPO" \
            --title "CI build failed: $SHA" \
            --body-file /tmp/body.md

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: firmware/build.log
