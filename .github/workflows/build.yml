name: 编译固件

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio
          pio --version

      - name: 缓存 PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: 编译固件
        working-directory: firmware
        run: |
          set -o pipefail
          {
            echo "### platformio 版本"
            pio --version
            echo
            echo "### platformio.ini"
            cat platformio.ini
            echo
            echo "### pio run"
          } > build.log
          pio run -v 2>&1 | tee -a build.log

      - name: 写构建日志到 summary
        if: always()
        working-directory: firmware
        run: |
          echo "### 构建日志" >> $GITHUB_STEP_SUMMARY
          echo "~~~" >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo "~~~" >> $GITHUB_STEP_SUMMARY

      - name: 合并 bin
        if: success()
        working-directory: firmware/.pio/build/esp32-c3-pro-mini
        run: |
          python - <<'PY'
          import pathlib
          parts = [
              (0x0,     pathlib.Path("bootloader.bin")),
              (0x8000,  pathlib.Path("partitions.bin")),
              (0xE000,  pathlib.Path("boot_app0.bin")),
              (0x10000, pathlib.Path("firmware.bin")),
          ]
          end = 0
          chunks = []
          for off, p in parts:
              data = p.read_bytes()
              chunks.append((off, data))
              end = max(end, off + len(data))
          buf = bytearray(b"ÿ" * end)
          for off, data in chunks:
              buf[off:off + len(data)] = data
          out = pathlib.Path("eink-mini-merged.bin")
          out.write_bytes(bytes(buf))
          print(f"已合并 {out} -> {len(buf)} 字节 (0x{end:X})，烧录地址 0x0")
          PY

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eink-mini-firmware
          path: |
            firmware/.pio/build/esp32-c3-pro-mini/bootloader.bin
            firmware/.pio/build/esp32-c3-pro-mini/partitions.bin
            firmware/.pio/build/esp32-c3-pro-mini/boot_app0.bin
            firmware/.pio/build/esp32-c3-pro-mini/firmware.bin
            firmware/.pio/build/esp32-c3-pro-mini/eink-mini-merged.bin

      - name: 失败时把构建日志写进 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        working-directory: firmware
        run: |
          set +e
          {
            echo "编译失败，commit $SHA"
            echo
            echo "~~~"
            cat build.log
            echo "~~~"
          } > /tmp/body.md
          gh issue create --repo "$REPO" \
            --title "CI 编译失败: $SHA" \
            --body-file /tmp/body.md

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: firmware/build.log
