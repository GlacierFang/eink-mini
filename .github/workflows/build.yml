name: 编译固件

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pio6118-plat690
            pio: "6.1.18"
            plat: "espressif32@6.9.0"
            scons: ""
          - name: pio6118-plat660
            pio: "6.1.18"
            plat: "espressif32@6.6.0"
            scons: ""
          - name: pio620-plat690-scons452
            pio: "6.2.0"
            plat: "espressif32@6.9.0"
            scons: "tool-scons@4.5.2"
    name: build-${{ matrix.name }}
    steps:
      - name: 拉代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 允许 git 读取工作区
        run: git config --global --add safe.directory '*'

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # 只缓存下载体积大的包，不缓存 ~/.platformio/penv。
      # penv 是 PlatformIO 自己的虚拟环境，shebang 写死创建时的 Python 路径，
      # Python 补丁号一变就 bad interpreter，命令直接 126 失败。
      - name: 缓存 PlatformIO 包
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-pkg-${{ matrix.name }}-${{ hashFiles('firmware/platformio.ini') }}-py3.11.9

      - name: 装 PlatformIO
        run: |
          set +e
          rm -rf ~/.platformio/penv
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'platformio==${{ matrix.pio }}'
          if [ -n '${{ matrix.scons }}' ]; then
            pio pkg install --global --tool '${{ matrix.scons }}' || echo 'tool-scons 指定版本安装失败，继续'
          fi
          pio --version
          python3 -c "import SCons; print('SCons', SCons.__version__)" 2>&1 | tail -1

      - name: 指定平台版本
        working-directory: firmware
        run: |
          set +e
          sed -i 's|^platform = .*|platform = ${{ matrix.plat }}|' platformio.ini
          grep -n 'platform =' platformio.ini

      - name: 编译固件
        working-directory: firmware
        run: |
          set +e
          {
            echo '### pio 版本'
            pio --version
            echo
            echo '### platformio.ini'
            cat platformio.ini
            echo
            echo '### pio run -v'
          } > build.log
          pio run -v 2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          echo "PIORC=$rc" | tee -a build.log
          exit $rc

      - name: 提取编译错误
        if: always()
        working-directory: firmware
        run: |
          set +e
          echo "日志字节数: $(wc -c < build.log)"
          echo '### 错误行'
          grep -hn -iE 'error:|fatal error|undefined reference|no such file|bad interpreter|command not found|Traceback|TypeError' build.log \
            | grep -viE 'Node\.js 20 is deprecated|deprecat' \
            | head -20 | while IFS= read -r l; do
                esc=$(printf '%s' "$l" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-400)
                echo "::error::$esc"
              done
          echo '### 日志尾 20 行'
          tail -20 build.log | while IFS= read -r l; do
              esc=$(printf '%s' "$l" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-300)
              echo "::notice::$esc"
            done

      - name: 合并 bin
        if: success()
        working-directory: firmware/.pio/build/esp32-c3-pro-mini
        run: |
          python3 - <<'PY'
          import pathlib
          parts = [
              (0x0,     pathlib.Path('bootloader.bin')),
              (0x8000,  pathlib.Path('partitions.bin')),
              (0xE000,  pathlib.Path('boot_app0.bin')),
              (0x10000, pathlib.Path('firmware.bin')),
          ]
          end = 0
          chunks = []
          for off, p in parts:
              data = p.read_bytes()
              chunks.append((off, data))
              end = max(end, off + len(data))
          buf = bytearray(b'\xff' * end)
          for off, data in chunks:
              buf[off:off + len(data)] = data
          out = pathlib.Path('eink-mini-merged.bin')
          out.write_bytes(bytes(buf))
          print(f'已合并 {out} -> {len(buf)} 字节 (0x{end:X})，烧录地址 0x0')
          PY

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eink-mini-firmware-${{ matrix.name }}
          path: |
            firmware/.pio/build/esp32-c3-pro-mini/bootloader.bin
            firmware/.pio/build/esp32-c3-pro-mini/partitions.bin
            firmware/.pio/build/esp32-c3-pro-mini/boot_app0.bin
            firmware/.pio/build/esp32-c3-pro-mini/firmware.bin
            firmware/.pio/build/esp32-c3-pro-mini/eink-mini-merged.bin

      # 日志走 git 推分支留档：artifact 下载主机在部分网络下取不到，
      # Contents API 又有 1MB 限制，git push 是唯一稳定通道。
      - name: 把构建日志推到分支
        if: always()
        env:
          SHA: ${{ github.sha }}
          BRANCH: ci-logs-${{ matrix.name }}
        working-directory: firmware
        run: |
          set +e
          git config user.name 'ci'
          git config user.email 'ci@local'
          cp build.log "ci-build-$SHA.log"
          BLOB=$(git hash-object -w "ci-build-$SHA.log")
          BASE=''
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            BASE=$(git rev-parse "refs/remotes/origin/$BRANCH")
          fi
          TMPIDX=$(mktemp)
          export GIT_INDEX_FILE=$TMPIDX
          if [ -n "$BASE" ]; then git read-tree "$BASE^{tree}"; else git read-tree --empty; fi
          git update-index --add --cacheinfo 100644,$BLOB,"ci/build-$SHA.log"
          TREE=$(git write-tree)
          if [ -n "$BASE" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$BASE" -m "ci: build log $SHA")
          else
            COMMIT=$(git commit-tree "$TREE" -m "ci: build log $SHA")
          fi
          git push origin "$COMMIT:refs/heads/$BRANCH" && echo "日志已推到 $BRANCH"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: firmware/build.log
