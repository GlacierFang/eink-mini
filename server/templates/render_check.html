<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渲染核对 · eink-mini</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2129; --line: #2a323d;
    --text: #e6edf3; --muted: #8b949e; --accent: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; }
  .muted { color: var(--muted); font-weight: 400; font-size: 13px; }
  .link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  }
  h1 { font-size: 19px; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0; }
  .cmp { display: flex; gap: 20px; flex-wrap: wrap; }
  figure { margin: 0; flex: 1 1 296px; }
  figure img {
    display: block; width: 296px; max-width: 100%; height: auto;
    image-rendering: pixelated; background: #fff; border-radius: 3px;
    border: 1px solid var(--line);
  }
  figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">eink-mini <span class="muted">渲染核对</span></div>
  <a class="link" href="/">← 回到控制台</a>
</header>
<main class="wrap">
  <section class="card">
    <h1>{{ page_id }} 页 · 量化策略对照</h1>
    <p class="note">
      左：设备真正收到的 1bpp 位图。右：面积平均降采样后的人眼视图。
    </p>
    <p class="note">
      面板 GDEH029A1 是单色屏，没有灰阶。屏上看到的层次来自黑色像素之间的物理缝隙，
      抖动图案在看不清单像素的距离上会积分成连续灰 ——
      所以「屏上实际什么样」要看右列，不是左列。
    </p>
    <p class="note">
      阈值越低笔画越粗、转折处越不容易断；dither 会引入噪点，代价是笔画连续性。
    </p>
  </section>

  {% for r in rows %}
  <section class="card">
    <h2>{{ r.label }}</h2>
    <div class="cmp">
      <figure>
        <img src="{{ r.device }}" alt="{{ r.label }} 设备位图">
        <figcaption>设备位图</figcaption>
      </figure>
      <figure>
        <img src="{{ r.eye }}" alt="{{ r.label }} 人眼视图">
        <figcaption>人眼视图</figcaption>
      </figure>
    </div>
  </section>
  {% endfor %}
</main>
</body>
</html>
